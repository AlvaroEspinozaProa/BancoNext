<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DinBank | Iniciar Sesión</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/login.css">
</head>

<body>

    <main class="login-container">

        <!-- Logo -->
        <section class="logo-section">

            <div class="logo-dino">
                🦖
            </div>

            <h1>DinBank</h1>

            <p class="subtitle">
                Tu banco inteligente
            </p>

        </section>

        <!-- Tarjeta Login -->
        <section class="login-card">

            <h2>Iniciar sesión</h2>

            <form id="loginForm">

                <!-- Usuario -->
                <div class="input-group">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresá tu usuario"
                        required>

                </div>

                <!-- Contraseña -->
                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresá tu contraseña"
                        required>

                </div>

                <!-- Mostrar contraseña -->
                <div class="remember">

                    <input
                        type="checkbox"
                        id="mostrarPassword">

                    <label for="mostrarPassword">

                        Mostrar contraseña

                    </label>

                </div>

                <!-- Botón -->
                <button
                    type="submit"
                    class="btn-login">

                    Ingresar

                </button>

            </form>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="java/login.js"></script>

</body>

</html>
