<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BancoDino | Inicio</title>

    <!-- CSS -->
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/dashboard.css">
    <link rel="stylesheet" href="estilos/navbar.css">
    <link rel="stylesheet" href="estilos/chatbot.css">
    <link rel="stylesheet" href="estilos/botones.css">

</head>


<body>


    <!-- CONTENEDOR PRINCIPAL -->
    <main class="dashboard">


        <!-- CABECERA DEL USUARIO -->
        <section class="usuario">

            <div class="saludo">
                <h2>
                    Hola, <span id="nombreUsuario">Usuario</span> 🦖
                </h2>

                <p>
                    Tu ahorro está creciendo
                </p>
            </div>


            <div class="saldo">

                <p>Saldo disponible</p>

                <h1>
                    $ <span id="saldoUsuario">150000</span>
                </h1>

            </div>

        </section>





        <!-- ZONA DEL DINOSAURIO -->

        <section class="zona-dino">


            <div class="dinosaurio-container">

                <img
                src="assets/dinosaurio.png"
                alt="Mascota BancoDino"
                id="dinosaurio"
                class="dino-flotando">
            </div>


            <div class="mensaje-dino">

                <p>
                    ¡Hola! Soy Dino 🦖
                </p>

                <span>
                    Te ayudaré a hacer crecer tus ahorros
                </span>

            </div>


        </section>






        <!-- PROYECCION DEL AHORRO -->

        <section class="proyeccion">


            <h2>
                Crecimiento de tu ahorro
            </h2>


            <div class="arboles">


                <div class="mes">

                    <img src="assets/arbol1.png">

                    <p>
                        1 mes
                    </p>

                </div>



                <div class="mes">

                    <img src="assets/arbol2.png">

                    <p>
                        3 meses
                    </p>

                </div>



                <div class="mes">

                    <img src="assets/arbol3.png">

                    <p>
                        6 meses
                    </p>

                </div>




                <div class="mes">

                    <img src="assets/arbol4.png">

                    <p>
                        9 meses
                    </p>

                </div>




                <div class="mes">

                    <img src="assets/arbol5.png">

                    <p>
                        12 meses
                    </p>

                </div>


            </div>


            <div class="resultado-ahorro">

                <p>
                    Proyección futura:
                </p>

                <h3 id="resultado">

                    $0

                </h3>


            </div>


        </section>







        <!-- BOTONES PRINCIPALES -->

<section class="acciones">

    <button class="btn metas">

        <div class="icono">
            🎯
        </div>

        <span>Metas</span>

    </button>


    <button class="btn ahorro">

        <div class="icono">
            💰
        </div>

        <span>Ahorro</span>

    </button>


    <button class="btn transferir">

        <div class="icono">
            💸
        </div>

        <span>Transferir</span>

    </button>

</section>






        <!-- CHATBOT -->


        <section class="chatbot">


       <div class="chat-header">

            <span>🦖</span>

            <h3>Asistente Dino</h3>

        </div>


            <div 
            class="chat-mensajes"
            id="mensajesChat">


                <p>
                    Hola, ¿necesitas ayuda?
                </p>


            </div>




            <div class="chat-input">


                <input 
                type="text"
                id="pregunta"
                placeholder="Escribe tu consulta...">



                <button id="enviarChat">

                    Enviar

                </button>


            </div>


        </section>






    </main>







    <!-- BARRA DE NAVEGACION INFERIOR -->


    <nav class="navbar">


        <button>

            🏠
            <span>
                Inicio
            </span>

        </button>



        <button>

            📊
            <span>
                Movimientos
            </span>

        </button>



        <button>

            QR
            <span>
                QR
            </span>

        </button>



        <button>

            💳
            <span>
                Tarjeta
            </span>

        </button>



        <button>

            ☰
            <span>
                Menú
            </span>

        </button>



    </nav>








    <!-- JAVASCRIPT -->

    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/dinosaurio.js"></script>
    <script src="js/grafico.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/ahorro.js"></script>



</body>

</html>
